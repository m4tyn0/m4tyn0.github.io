<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">mc</div>
            <nav class="menu">
                <ul id="file-list">
                    <!-- File list will be populated by JS -->
                </ul>
            </nav>
        </aside>
        <main class="content">
            <div id="markdown-content">
                <!-- Markdown content will be rendered here -->
            </div>
        </main>
    </div>
    <footer class="footer">
        <span id="session-timer">[session 00:00:00]</span>
        <span id="visitor-location">[visitor from ...]</span>
        <span id="time-display">[you: --:-- | me: --:-- cet]</span>
        <span id="status">[open to projects]</span>
        <span class="note">location via ip (not stored)</span>
    </footer>
    <script src="{{ '/main.js' | relative_url }}"></script>
</body>
</html>
